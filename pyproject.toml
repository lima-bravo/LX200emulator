[project]
name = "lx200emulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
# Asyncio-based server (scopeboss_emulator package — recommended for development)
scopeboss-emulator = "scopeboss_emulator.server:main"
# Threading-based standalone emulator (lx200emulator_v2.py — legacy / simpler)
lx200emulator = "lx200emulator_v2:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
# Required for console_scripts entry points to be installed
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scopeboss_emulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests (parser, policy, reducer); no TCP or server.",
]
addopts = "-v"
